<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eigen Entropy</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        position: relative;
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: #000;
    }


    /* =====================================================
       LOGO
       ===================================================== */

    .logo {
        position: absolute;
        top: 14px;
        left: 24px;
        z-index: 10;
    }

    .logo-ee {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 76px;
        line-height: 0.78;
        font-weight: bold;
        font-style: italic;
        letter-spacing: -6px;
        color: #fff;
    }

    .logo-name {
        display: flex;
        gap: 27px;

        margin-top: 8px;
        padding-left: 27px;

        font-family: Georgia, "Times New Roman", serif;
        font-size: 17px;
        font-weight: bold;
        font-style: italic;

        color: #fff;
    }


    /* =====================================================
       CONTACT
       ===================================================== */

    .contact {
        position: absolute;
        top: 22px;
        right: 28px;

        padding: 14px 31px;

        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 40px;

        background: rgba(255,255,255,0.025);

        color: #fff;

        font-size: 16px;
        font-weight: 400;

        z-index: 10;
    }


    /* =====================================================
       HERO
       ===================================================== */

    .hero {
        position: absolute;

        top: 29%;
        left: 50%;

        width: 100%;

        transform: translateX(-50%);

        text-align: center;

        z-index: 6;
    }

    .hero h1 {
        margin: 0;

        color: #f5f5f5;

        font-size: clamp(48px, 5vw, 74px);
        font-weight: 400;

        letter-spacing: -3px;
        line-height: 1.05;
    }


    /* =====================================================
       COMING SOON
       ===================================================== */

    .coming-soon {
        display: flex;
        align-items: center;
        justify-content: center;

        width: 390px;
        height: 104px;

        margin: 28px auto 0;

        border: 1px solid rgba(255,255,255,0.24);
        border-radius: 17px;

        background:
            linear-gradient(
                145deg,
                rgba(48,48,48,0.9),
                rgba(13,13,13,0.95)
            );

        box-shadow:
            0 18px 45px rgba(0,0,0,0.55),
            inset 0 1px 0 rgba(255,255,255,0.07);

        color: #fff;

        font-size: 34px;
        font-weight: 400;
    }


    /* =====================================================
       FLOATING CONCEPT WORDS
       ===================================================== */

    .concept {
        position: absolute;

        color: rgba(255,255,255,0.88);

        font-size: 14px;
        font-weight: 400;

        white-space: nowrap;

        z-index: 5;

        will-change: transform;
    }


    /* -----------------------------------------------------
       PRIVATE
       ----------------------------------------------------- */

    .private {
        left: 42%;
        top: 17%;

        animation:
            privateFloat
            18s
            ease-in-out
            infinite;
    }

    @keyframes privateFloat {

        0% {
            transform: translate(0px, 0px);
        }

        25% {
            transform: translate(35px, 18px);
        }

        50% {
            transform: translate(12px, 42px);
        }

        75% {
            transform: translate(-28px, 20px);
        }

        100% {
            transform: translate(0px, 0px);
        }
    }


    /* -----------------------------------------------------
       SECURE
       ----------------------------------------------------- */

    .secure {
        right: 17%;
        top: 25%;

        animation:
            secureFloat
            21s
            ease-in-out
            infinite;
    }

    @keyframes secureFloat {

        0% {
            transform: translate(0px, 0px);
        }

        25% {
            transform: translate(-28px, 26px);
        }

        50% {
            transform: translate(-55px, 5px);
        }

        75% {
            transform: translate(-20px, -22px);
        }

        100% {
            transform: translate(0px, 0px);
        }
    }


    /* -----------------------------------------------------
       VECTOR
       ----------------------------------------------------- */

    .vector {
        left: 15%;
        top: 36%;

        animation:
            vectorFloat
            24s
            ease-in-out
            infinite;
    }

    @keyframes vectorFloat {

        0% {
            transform: translate(0px, 0px);
        }

        25% {
            transform: translate(28px, -25px);
        }

        50% {
            transform: translate(62px, 10px);
        }

        75% {
            transform: translate(30px, 35px);
        }

        100% {
            transform: translate(0px, 0px);
        }
    }


    /* -----------------------------------------------------
       AXIS
       ----------------------------------------------------- */

    .axis {
        right: 14%;
        top: 59%;

        animation:
            axisFloat
            20s
            ease-in-out
            infinite;
    }

    @keyframes axisFloat {

        0% {
            transform: translate(0px, 0px);
        }

        25% {
            transform: translate(-35px, -18px);
        }

        50% {
            transform: translate(-8px, -45px);
        }

        75% {
            transform: translate(28px, -20px);
        }

        100% {
            transform: translate(0px, 0px);
        }
    }


    /* -----------------------------------------------------
       RE-DESIGN
       ----------------------------------------------------- */

    .redesign {
        left: 4%;
        bottom: 16%;

        animation:
            redesignFloat
            23s
            ease-in-out
            infinite;
    }

    @keyframes redesignFloat {

        0% {
            transform: translate(0px, 0px);
        }

        25% {
            transform: translate(40px, -15px);
        }

        50% {
            transform: translate(70px, 8px);
        }

        75% {
            transform: translate(35px, 30px);
        }

        100% {
            transform: translate(0px, 0px);
        }
    }


    /* -----------------------------------------------------
       OPTIMIZE
       ----------------------------------------------------- */

    .optimize {
        left: 47%;
        bottom: 8%;

        animation:
            optimizeFloat
            19s
            ease-in-out
            infinite;
    }

    @keyframes optimizeFloat {

        0% {
            transform: translate(0px, 0px);
        }

        25% {
            transform: translate(-30px, -25px);
        }

        50% {
            transform: translate(15px, -48px);
        }

        75% {
            transform: translate(45px, -20px);
        }

        100% {
            transform: translate(0px, 0px);
        }
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 900px) {

        .logo {
            left: 18px;
            top: 12px;
        }

        .logo-ee {
            font-size: 60px;
        }

        .logo-name {
            font-size: 14px;
            gap: 20px;
            padding-left: 20px;
        }

        .contact {
            top: 18px;
            right: 18px;
            padding: 11px 21px;
            font-size: 14px;
        }

        .hero {
            top: 32%;
        }

        .hero h1 {
            font-size: 44px;
            letter-spacing: -2px;
        }

        .coming-soon {
            width: 300px;
            height: 82px;
            font-size: 27px;
        }

        .concept {
            font-size: 12px;
        }

        .vector {
            left: 10%;
        }

        .secure {
            right: 9%;
        }

        .axis {
            right: 9%;
        }
    }


    @media (max-width: 600px) {

        .logo {
            left: 15px;
            top: 12px;
        }

        .logo-ee {
            font-size: 48px;
        }

        .logo-name {
            font-size: 11px;
            gap: 15px;
            padding-left: 17px;
        }

        .contact {
            top: 15px;
            right: 12px;
            padding: 9px 16px;
            font-size: 12px;
        }

        .hero {
            top: 32%;
        }

        .hero h1 {
            font-size: 36px;
            letter-spacing: -1.5px;
        }

        .coming-soon {
            width: 260px;
            height: 70px;
            margin-top: 22px;
            font-size: 23px;
        }

        .concept {
            font-size: 11px;
        }

        .private {
            left: 40%;
            top: 20%;
        }

        .secure {
            right: 7%;
            top: 27%;
        }

        .vector {
            left: 7%;
            top: 38%;
        }

        .axis {
            right: 7%;
            top: 62%;
        }

        .redesign {
            left: 4%;
            bottom: 17%;
        }

        .optimize {
            left: 43%;
            bottom: 8%;
        }
    }

</style>
</head>


<body>

<div class="page">


    <!-- =================================================
         LOGO
         ================================================= -->

    <div class="logo">

        <div class="logo-ee">
            EE
        </div>

        <div class="logo-name">
            <span>Eigen</span>
            <span>Entropy</span>
        </div>

    </div>


    <!-- =================================================
         CONTACT
         ================================================= -->

    <div class="contact">
        Contact Us
    </div>


    <!-- =================================================
         FLOATING WORDS
         ================================================= -->

    <div class="concept private">
        Private
    </div>

    <div class="concept secure">
        Secure
    </div>

    <div class="concept vector">
        Vector
    </div>

    <div class="concept axis">
        Axis
    </div>

    <div class="concept redesign">
        Re-design
    </div>

    <div class="concept optimize">
        Optimize
    </div>


    <!-- =================================================
         HERO
         ================================================= -->

    <main class="hero">

        <h1>
            Decisions with Confidence
        </h1>

        <div class="coming-soon">
            Coming Soon...
        </div>

    </main>


</div>

</body>
</html>
