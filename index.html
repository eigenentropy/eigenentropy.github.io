<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eigen Entropy</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        position: relative;
    }

    /* =========================================
       BACKGROUND
       ========================================= */

    .background {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
        background: #000;
    }

    /*
       Globe image.

       IMPORTANT:
       Replace "globe.png" below with the exact
       filename of your uploaded globe image if
       it is different.
    */
    .globe {
        position: absolute;

        width: 850px;
        height: 850px;

        left: -90px;
        bottom: -210px;

        object-fit: contain;

        opacity: 0.075;

        filter:
            grayscale(1)
            brightness(1.8)
            contrast(0.8);

        transform-origin: center center;

        animation: globeRotate 90s linear infinite;
    }

    @keyframes globeRotate {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }


    /* =========================================
       VERY SUBTLE SPATIAL LINES
       ========================================= */

    .ambient-line {
        position: absolute;
        height: 1px;

        background: rgba(255,255,255,0.045);

        transform-origin: left center;
    }

    .line-one {
        width: 100%;
        top: 18%;
        left: 0;
        transform: rotate(4deg);
    }

    .line-two {
        width: 100%;
        top: 44%;
        left: 0;
        transform: rotate(-3deg);
    }

    .line-three {
        width: 100%;
        top: 72%;
        left: 0;
        transform: rotate(1deg);
    }


    /* =========================================
       MAIN CONTENT
       ========================================= */

    .page {
        position: relative;
        width: 100%;
        height: 100vh;

        z-index: 2;
    }


    /* =========================================
       LOGO
       ========================================= */

    .logo {
        position: absolute;

        top: 12px;
        left: 24px;

        z-index: 10;

        text-align: left;
    }

    .logo-ee {
        font-family: Georgia, "Times New Roman", serif;

        font-size: 76px;
        line-height: 0.78;

        font-weight: bold;
        font-style: italic;

        letter-spacing: -6px;

        color: #fff;
    }

    .logo-name {
        margin-top: 8px;

        display: flex;
        gap: 27px;

        padding-left: 27px;

        font-family: Georgia, "Times New Roman", serif;

        font-size: 18px;
        font-weight: bold;
        font-style: italic;

        color: #fff;
    }


    /* =========================================
       CONTACT BUTTON
       ========================================= */

    .contact {
        position: absolute;

        top: 22px;
        right: 24px;

        padding: 15px 34px;

        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 40px;

        background: rgba(0,0,0,0.35);

        color: #fff;

        font-size: 17px;

        backdrop-filter: blur(4px);

        z-index: 10;
    }


    /* =========================================
       CONCEPT WORDS
       ========================================= */

    .concept {
        position: absolute;

        font-size: 14px;

        color: rgba(255,255,255,0.9);

        z-index: 5;

        white-space: nowrap;
    }

    .private {
        top: 17%;
        left: 44%;
    }

    .secure {
        top: 25%;
        right: 17%;
    }

    .vector {
        top: 35%;
        left: 15%;
    }

    .axis {
        top: 61%;
        right: 15%;
    }

    .redesign {
        bottom: 15%;
        left: 3%;
    }

    .optimize {
        bottom: 7%;
        left: 47%;
    }


    /* =========================================
       HERO
       ========================================= */

    .hero {
        position: absolute;

        top: 28%;
        left: 50%;

        transform: translateX(-50%);

        width: 100%;

        text-align: center;

        z-index: 6;
    }

    .hero h1 {
        margin: 0;

        font-size: clamp(48px, 5.2vw, 78px);

        line-height: 1.05;

        font-weight: 400;

        letter-spacing: -3px;

        color: #f4f4f4;
    }


    /* =========================================
       COMING SOON BUTTON
       ========================================= */

    .coming-soon {
        display: flex;

        align-items: center;
        justify-content: center;

        width: 390px;
        height: 104px;

        margin: 28px auto 0;

        border-radius: 17px;

        border: 1px solid rgba(255,255,255,0.25);

        background:
            linear-gradient(
                145deg,
                rgba(45,45,45,0.95),
                rgba(13,13,13,0.95)
            );

        box-shadow:
            0 20px 50px rgba(0,0,0,0.65),
            inset 0 1px 1px rgba(255,255,255,0.08);

        color: #fff;

        font-size: 34px;

        font-weight: 400;

        backdrop-filter: blur(6px);
    }


    /* =========================================
       RESPONSIVE
       ========================================= */

    @media (max-width: 900px) {

        .globe {
            width: 650px;
            height: 650px;

            left: -180px;
            bottom: -120px;

            opacity: 0.06;
        }

        .logo-ee {
            font-size: 60px;
        }

        .logo-name {
            font-size: 15px;
            gap: 20px;
        }

        .contact {
            top: 18px;
            right: 18px;

            padding: 12px 22px;

            font-size: 14px;
        }

        .hero {
            top: 32%;
        }

        .hero h1 {
            font-size: 44px;
            letter-spacing: -2px;
        }

        .coming-soon {
            width: 300px;
            height: 82px;

            font-size: 27px;
        }

        .vector {
            left: 10%;
        }

        .secure {
            right: 10%;
        }

        .axis {
            right: 10%;
        }
    }


    @media (max-width: 600px) {

        .logo {
            left: 15px;
            top: 12px;
        }

        .logo-ee {
            font-size: 48px;
        }

        .logo-name {
            padding-left: 18px;
            gap: 16px;
            font-size: 12px;
        }

        .contact {
            right: 12px;
            top: 15px;

            padding: 10px 17px;

            font-size: 12px;
        }

        .hero {
            top: 33%;
        }

        .hero h1 {
            font-size: 36px;
            letter-spacing: -1.5px;
        }

        .coming-soon {
            width: 260px;
            height: 70px;

            margin-top: 22px;

            font-size: 23px;
        }

        .concept {
            font-size: 11px;
        }

        .private {
            top: 20%;
        }

        .vector {
            top: 37%;
            left: 7%;
        }

        .secure {
            top: 27%;
            right: 7%;
        }

        .axis {
            right: 7%;
        }

        .redesign {
            left: 4%;
        }

        .optimize {
            left: 44%;
        }

        .globe {
            width: 500px;
            height: 500px;

            left: -150px;
            bottom: -80px;

            opacity: 0.055;
        }
    }

</style>
</head>


<body>

<!-- =========================================
     BACKGROUND
     ========================================== -->

<div class="background">

    <!-- Globe -->
    <img
        class="globe"
        src="globe.png"
        alt=""
    >

    <!-- Very subtle spatial lines -->
    <div class="ambient-line line-one"></div>
    <div class="ambient-line line-two"></div>
    <div class="ambient-line line-three"></div>

</div>


<!-- =========================================
     PAGE
     ========================================== -->

<div class="page">


    <!-- =====================================
         LOGO
         ====================================== -->

    <div class="logo">

        <div class="logo-ee">
            EE
        </div>

        <div class="logo-name">
            <span>Eigen</span>
            <span>Entropy</span>
        </div>

    </div>


    <!-- =====================================
         CONTACT
         ====================================== -->

    <div class="contact">
        Contact Us
    </div>


    <!-- =====================================
         CONCEPT WORDS
         ====================================== -->

    <div class="concept private">
        Private
    </div>

    <div class="concept secure">
        Secure
    </div>

    <div class="concept vector">
        Vector
    </div>

    <div class="concept axis">
        Axis
    </div>

    <div class="concept redesign">
        Re-design
    </div>

    <div class="concept optimize">
        Optimize
    </div>


    <!-- =====================================
         HERO
         ====================================== -->

    <main class="hero">

        <h1>
            Decisions with Confidence
        </h1>

        <div class="coming-soon">
            Coming Soon...
        </div>

    </main>

</div>

</body>
</html>
