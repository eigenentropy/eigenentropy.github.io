<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eigen Entropy</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        position: relative;
    }

    /* =========================================================
       BACKGROUND
       ========================================================= */

    .background {
        position: fixed;
        inset: 0;
        background: #000;
        overflow: hidden;
        z-index: 0;
    }

    /*
       Rotating coordinate globe.
       The PNG should sit in the same folder as index.html.
    */

    .coordinate-globe {
        position: absolute;
        left: -8%;
        bottom: -30%;
        width: 78vw;
        max-width: 1050px;

        opacity: 0.16;

        pointer-events: none;
        user-select: none;

        transform-origin: center center;

        animation: globeMotion 90s ease-in-out infinite;
    }

    .coordinate-globe img {
        display: block;
        width: 100%;
        height: auto;
    }

    @keyframes globeMotion {
        0% {
            transform: rotate(-3deg);
        }

        50% {
            transform: rotate(3deg);
        }

        100% {
            transform: rotate(-3deg);
        }
    }


    /* =========================================================
       SUBTLE ATMOSPHERE
       ========================================================= */

    .ambient {
        position: absolute;
        inset: 0;

        background:
            radial-gradient(
                ellipse at 50% 42%,
                rgba(255,255,255,0.025) 0%,
                rgba(255,255,255,0.008) 32%,
                rgba(0,0,0,0) 65%
            );

        pointer-events: none;
        z-index: 1;
    }


    /* =========================================================
       MAIN PAGE
       ========================================================= */

    .page {
        position: relative;
        width: 100%;
        height: 100%;
        z-index: 2;
    }


    /* =========================================================
       LOGO
       ========================================================= */

    .logo {
        position: absolute;
        top: 14px;
        left: 24px;

        color: #fff;

        z-index: 5;
        user-select: none;
    }

    .logo-main {
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-weight: bold;

        font-size: 76px;
        line-height: 0.78;
        letter-spacing: -5px;
    }

    .logo-sub {
        display: flex;
        gap: 24px;

        margin-top: 5px;
        margin-left: 23px;

        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-weight: bold;

        font-size: 16px;
        line-height: 1;
    }


    /* =========================================================
       CONTACT
       ========================================================= */

    .contact {
        position: absolute;
        top: 23px;
        right: 36px;

        padding: 14px 29px;

        border: 1px solid rgba(255,255,255,0.24);
        border-radius: 30px;

        background: rgba(20,20,20,0.55);

        color: #fff;

        font-size: 16px;

        backdrop-filter: blur(4px);

        z-index: 5;

        transition:
            background 0.25s ease,
            border-color 0.25s ease,
            transform 0.25s ease;
    }

    .contact:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.45);
        transform: translateY(-1px);
    }


    /* =========================================================
       CENTRAL MESSAGE
       ========================================================= */

    .hero {
        position: absolute;

        top: 30%;
        left: 50%;

        transform: translateX(-50%);

        width: 90%;
        text-align: center;

        z-index: 4;
    }

    .hero h1 {
        font-size: clamp(44px, 5vw, 74px);

        font-weight: 400;
        letter-spacing: -3px;

        line-height: 1.05;

        color: #f5f5f5;
    }


    /* =========================================================
       COMING SOON
       ========================================================= */

    .coming-soon {
        position: absolute;

        top: 46%;
        left: 50%;

        transform: translate(-50%, -50%);

        min-width: 350px;

        padding: 30px 50px;

        border-radius: 15px;

        border: 1px solid rgba(255,255,255,0.22);

        background:
            linear-gradient(
                145deg,
                rgba(55,55,55,0.65),
                rgba(12,12,12,0.78)
            );

        box-shadow:
            0 12px 35px rgba(0,0,0,0.65),
            inset 0 1px 0 rgba(255,255,255,0.06);

        color: #f4f4f4;

        text-align: center;

        font-size: 35px;
        font-weight: 400;

        z-index: 4;
    }


    /* =========================================================
       FIELD LABELS
       ========================================================= */

    .label {
        position: absolute;

        color: rgba(255,255,255,0.9);

        font-size: 13px;
        font-weight: 400;

        z-index: 4;

        white-space: nowrap;
    }

    .private {
        top: 17%;
        left: 43%;
    }

    .secure {
        top: 25%;
        right: 17%;
    }

    .vector {
        top: 35%;
        left: 15%;
    }

    .axis {
        top: 59%;
        right: 15%;
    }

    .redesign {
        bottom: 17%;
        left: 3%;
    }

    .optimize {
        bottom: 9%;
        left: 47%;
    }


    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 900px) {

        .logo {
            left: 18px;
            top: 12px;
        }

        .logo-main {
            font-size: 58px;
        }

        .logo-sub {
            font-size: 13px;
            gap: 18px;
            margin-left: 18px;
        }

        .contact {
            right: 18px;
            top: 18px;

            padding: 11px 20px;

            font-size: 14px;
        }

        .hero {
            top: 31%;
        }

        .hero h1 {
            font-size: clamp(38px, 7vw, 58px);
            letter-spacing: -2px;
        }

        .coming-soon {
            min-width: 290px;
            padding: 24px 35px;
            font-size: 28px;
        }

        .coordinate-globe {
            left: -20%;
            bottom: -10%;
            width: 105vw;
        }

        .private {
            top: 18%;
            left: 40%;
        }

        .secure {
            top: 26%;
            right: 9%;
        }

        .vector {
            left: 10%;
            top: 36%;
        }

        .axis {
            right: 8%;
            top: 61%;
        }

        .optimize {
            left: 44%;
        }
    }


    @media (max-width: 600px) {

        .logo-main {
            font-size: 46px;
        }

        .logo-sub {
            font-size: 11px;
            gap: 14px;
            margin-left: 14px;
        }

        .contact {
            padding: 9px 15px;
            font-size: 12px;
        }

        .hero {
            top: 32%;
        }

        .hero h1 {
            font-size: 38px;
            letter-spacing: -1.5px;
        }

        .coming-soon {
            top: 47%;
            min-width: 240px;
            padding: 20px 25px;
            font-size: 22px;
        }

        .label {
            font-size: 11px;
        }

        .vector {
            left: 7%;
        }

        .secure {
            right: 6%;
        }

        .axis {
            right: 6%;
        }

        .redesign {
            left: 4%;
        }

        .coordinate-globe {
            left: -35%;
            bottom: -3%;
            width: 125vw;
            opacity: 0.13;
        }
    }

</style>
</head>


<body>

    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <div class="background">

        <div class="coordinate-globe">
            <img
                src="eigen-entropy-coordinate-globe.png"
                alt=""
            >
        </div>

    </div>

    <div class="ambient"></div>


    <!-- =====================================================
         PAGE
         ===================================================== -->

    <main class="page">


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-main">
                EE
            </div>

            <div class="logo-sub">
                <span>Eigen</span>
                <span>Entropy</span>
            </div>

        </div>


        <!-- CONTACT -->

        <div class="contact">
            Contact Us
        </div>


        <!-- FIELD LABELS -->

        <div class="label private">
            Private
        </div>

        <div class="label secure">
            Secure
        </div>

        <div class="label vector">
            Vector
        </div>

        <div class="label axis">
            Axis
        </div>

        <div class="label redesign">
            Re-design
        </div>

        <div class="label optimize">
            Optimize
        </div>


        <!-- HERO -->

        <section class="hero">

            <h1>
                Decisions with Confidence
            </h1>

        </section>


        <!-- COMING SOON -->

        <div class="coming-soon">
            Coming Soon...
        </div>


    </main>

</body>
</html>
