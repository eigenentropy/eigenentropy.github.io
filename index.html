<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eigen Entropy — Decisions with Confidence</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        position: relative;
    }

    /* =========================================================
       COORDINATE FIELD
       ========================================================= */

    .coordinate-field {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    .coordinate-field svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    .field-line {
        fill: none;
        stroke: rgba(220, 220, 220, 0.085);
        stroke-width: 1;
    }

    .field-line-light {
        fill: none;
        stroke: rgba(235, 235, 235, 0.11);
        stroke-width: 1;
    }

    .axis-line {
        fill: none;
        stroke: rgba(235, 235, 235, 0.16);
        stroke-width: 1.2;
    }

    .origin {
        fill: rgba(245, 245, 245, 0.35);
    }

    /* =========================================================
       PAGE CONTENT
       ========================================================= */

    .page {
        position: relative;
        width: 100%;
        height: 100vh;
        min-height: 600px;
        z-index: 2;
    }

    /* =========================================================
       LOGO
       ========================================================= */

    .logo {
        position: absolute;
        top: 8px;
        left: 22px;
        z-index: 5;
        text-align: left;
    }

    .logo-ee {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 78px;
        line-height: 0.78;
        font-weight: bold;
        font-style: italic;
        letter-spacing: -7px;
        color: #ffffff;
    }

    .logo-name {
        margin-top: 4px;
        margin-left: 26px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 15px;
        font-weight: bold;
        font-style: italic;
        letter-spacing: 1px;
        color: #ffffff;
        word-spacing: 10px;
    }

    /* =========================================================
       CONTACT
       ========================================================= */

    .contact {
        position: absolute;
        top: 23px;
        right: 38px;
        z-index: 5;

        padding: 16px 30px;

        border: 1px solid rgba(255,255,255,0.22);
        border-radius: 30px;

        background: rgba(15,15,15,0.72);
        color: #f2f2f2;

        font-size: 16px;
        font-weight: 400;

        box-shadow:
            0 0 20px rgba(255,255,255,0.035),
            inset 0 0 15px rgba(255,255,255,0.02);
    }

    /* =========================================================
       CONCEPT LABELS
       ========================================================= */

    .label {
        position: absolute;
        z-index: 4;

        color: rgba(255,255,255,0.92);
        font-size: 14px;
        font-weight: 400;
    }

    .private {
        top: 17%;
        left: 43%;
    }

    .secure {
        top: 25%;
        right: 17%;
    }

    .vector {
        top: 35%;
        left: 15%;
    }

    .axis {
        top: 58%;
        right: 13%;
    }

    .redesign {
        bottom: 18%;
        left: 3%;
    }

    .optimize {
        bottom: 10%;
        left: 46%;
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
        position: absolute;
        top: 27%;
        left: 50%;
        transform: translateX(-50%);

        width: 90%;
        text-align: center;

        z-index: 4;
    }

    .hero h1 {
        font-size: clamp(48px, 4.2vw, 72px);
        font-weight: 300;
        letter-spacing: -2px;
        line-height: 1.1;
        color: #f5f5f5;
        white-space: nowrap;
    }

    /* =========================================================
       COMING SOON
       ========================================================= */

    .coming-soon {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translateX(-50%);

        width: 352px;
        height: 102px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 15px;

        border: 1px solid rgba(255,255,255,0.22);

        background:
            linear-gradient(
                145deg,
                rgba(50,50,50,0.78),
                rgba(15,15,15,0.82)
            );

        box-shadow:
            0 0 35px rgba(255,255,255,0.055),
            inset 0 1px 0 rgba(255,255,255,0.08);

        color: #f5f5f5;

        font-size: 34px;
        font-weight: 300;

        z-index: 4;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 800px) {

        .logo {
            left: 16px;
            top: 12px;
        }

        .logo-ee {
            font-size: 55px;
        }

        .logo-name {
            font-size: 11px;
            margin-left: 18px;
        }

        .contact {
            top: 15px;
            right: 15px;
            padding: 11px 18px;
            font-size: 13px;
        }

        .hero {
            top: 32%;
        }

        .hero h1 {
            white-space: normal;
            font-size: 40px;
        }

        .coming-soon {
            top: 48%;
            width: 280px;
            height: 82px;
            font-size: 26px;
        }

        .private {
            top: 20%;
            left: 42%;
        }

        .secure {
            top: 29%;
            right: 8%;
        }

        .vector {
            top: 39%;
            left: 7%;
        }

        .axis {
            top: 62%;
            right: 8%;
        }

        .redesign {
            bottom: 17%;
            left: 4%;
        }

        .optimize {
            bottom: 8%;
            left: 42%;
        }
    }
</style>
</head>

<body>

    <path
        class="field-line"

         SUBTLE DIAGONAL DEPTH AXIS
         ===================================================== -->

    <path
        class="axis-line"
        d="M 80 720
           C 420 500, 820 300, 1260 190
           C 1490 130, 1690 105, 1880 95"
    />

</svg>

</div>


<!-- =========================================================
     PAGE
     ========================================================= -->

<div class="page">

    <!-- Logo -->
    <div class="logo">
        <div class="logo-ee">EE</div>
        <div class="logo-name">Eigen&nbsp;&nbsp;&nbsp;Entropy</div>
    </div>


    <!-- Contact -->
    <div class="contact">
        Contact Us
    </div>


    <!-- Concept labels -->

    <div class="label private">
        Private
    </div>

    <div class="label secure">
        Secure
    </div>

    <div class="label vector">

    </div>

    <div class="label axis">
        Axis
    </div>

    <div class="label redesign">

    </div>

    <div class="label optimize">
        Optimize

    <!-- Hero -->

    <main class="hero">

        <h1>
            Decisions with Confidence
        </h1>

    </main>


    <!-- Coming Soon -->

    <div class="coming-soon">

    </div>

</div>

</body>
</html>
